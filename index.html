<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Block</title>
<style>
  body {
    background: #f5f5f5;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
    margin: 0;
  }
  .container {
    background: white;
    width: 100%;
    max-width: 500px;
    padding: 30px 30px 15px 30px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
  }
  .box {
    border: 2px solid black;
    border-radius: 8px;
    padding: 18px;
    text-align: center;
    font-size: 18px;
    margin-bottom: 20px;
    background: white;
    cursor: pointer;
    display: block;
    text-decoration: none;
    color: black;
  }
  .box:hover { background: black; color: white; }
  .top-box { font-size: 20px; cursor: default; }
  .top-box:hover { background: white; color: black; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .big-square { aspect-ratio: 1 / 1; text-align: left; padding: 12px; font-size: 16px; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .small { font-size: 15px; padding: 12px 5px; }
  .footer { text-align: center; font-size: 12px; color: #777; margin-top: 25px; }
</style>
</head>
<body>
  <div class="container">
    <div class="box top-box">
      Willkommen bei Alex Block, hier könnt ihr auswählen was ihr wollt
    </div>
    <div class="grid-2">
      <a href="#" class="box big-square">Menschen und Figuren</a>
      <a href="#" class="box big-square">Gebäude und Hintergrund</a>
    </div>
    <div class="grid-2">
      <a href="#" class="box">Telegram</a>
      <a href="#" class="box">Whatsapp</a>
    </div>
    <a href="#" class="box">Unterstützen sie uns!</a>
    <div class="grid-4">
      <a href="#" class="box small">Youtube</a>
      <a href="#" class="box small">Instagram</a>
      <a href="#" class="box small">Facebook</a>
      <a href="#" class="box small">Tiktok</a>
    </div>
    <a href="mailto:deine-email@beispiel.de" class="box">Bei Fragen (Email)</a>
    <div class="footer">All rights reserved | Copyright | design: @tt.joris</div>
  </div>
</body>
</html>
